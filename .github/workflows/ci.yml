name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Run test suite
        run: pytest tests/ -v

  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit this repository with itself
        run: |
          python scripts/audit_skill.py --path . --json audit-report.json
          python - <<'EOF'
          import json
          r = json.load(open("audit-report.json", encoding="utf-8"))
          print(f"self-audit: {r['score']}/100 {r['verdict']}")
          assert r["verdict"] == "SHIPPABLE", f"self-audit regressed: {r['verdict']}"
          EOF
